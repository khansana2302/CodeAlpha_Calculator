<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CalcSpace Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
<section class="calc">
<header><div><small>EVERYDAY TOOL</small><h1>CalcSpace</h1></div>
<button id="theme" aria-label="Toggle theme">☼</button>
</header><div class="screen"><div id="expression"></div>
<output id="display">0</output>
</div><div class="keys" id="keys">
<button class="util" data-action="clear">AC</button>
<button class="util" data-action="delete">DEL</button>
<button class="op" data-value="%">%</button>
<button class="op" data-value="/">÷</button>
<button data-value="7">7</button>
<button data-value="8">8</button>
<button data-value="9">9</button>
<button class="op" data-value="*">×</button>
<button data-value="4">4</button>
<button data-value="5">5</button>
<button data-value="6">6</button>
<button class="op" data-value="-">−</button>
<button data-value="1">1</button>
<button data-value="2">2</button>
<button data-value="3">3</button>
<button class="op" data-value="+">+</button>
<button class="zero" data-value="0">0</button>
<button data-value=".">.</button>
<button class="equal" data-action="equals">=</button>
</div>
<p class="hint">Keyboard supported · Enter = result</p>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
